# SonarQube Community Edition 26.9.0.129388 -- the version fixed by the assessment.
#
# Run it with:  ./run.sh sonar          (see tools/sonarqube/README.md)
#
# Why the paths below are split the way they are:
#
#   sonar.sources   application code that is graded. `scripts/` is Python tooling
#                   that generates the seed and the diagrams -- it ships no
#                   runtime behaviour, so including it would dilute the metrics
#                   with code the brief never asked for.
#   sonar.tests     declared separately so Sonar applies its test-specific rules
#                   (and does NOT count assertions as untested code, which would
#                   silently deflate coverage).
#   vendor/         excluded explicitly. It is git-ignored but still present on
#                   disk, and scanning third-party code would swamp every metric.

sonar.projectKey=stockpile
sonar.projectName=Stockpile - Inventory & Order Management
sonar.projectVersion=1.0.0

sonar.sources=app,public,views
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Generated by `composer test:coverage`; regenerate before every scan or Sonar
# reports stale figures without warning.
sonar.php.coverage.reportPaths=build/coverage/clover.xml
sonar.php.tests.reportPaths=build/coverage/junit.xml

sonar.exclusions=vendor/**,build/**,docs/**,public/assets/icons.svg
sonar.coverage.exclusions=public/index.php,views/**
